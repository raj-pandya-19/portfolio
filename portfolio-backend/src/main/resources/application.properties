spring.application.name=portfolio-backend

# =========================
# DATABASE
# =========================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portfolio_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true

# =========================
# ADMIN AUTHENTICATION
# =========================
portfolio.admin.username=${ADMIN_USERNAME}
portfolio.admin.password=${ADMIN_PASSWORD_HASH}
# =========================
# JWT
# =========================

portfolio.jwt.secret=${JWT_SECRET}
portfolio.jwt.expiration=${JWT_EXPIRATION:86400000}
# =========================
# FILE UPLOAD
# =========================
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================
# EMAIL / GMAIL SMTP
# =========================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email address that receives portfolio contact notifications
portfolio.contact.notification-email=${CONTACT_NOTIFICATION_EMAIL:}

# =========================
# FRONTEND / CORS
# =========================
portfolio.frontend-url=${FRONTEND_URL:http://localhost:5173}